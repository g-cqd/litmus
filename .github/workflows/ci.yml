name: CI

# swift-ci plans and runs the checks from .ci/action.json (https://github.com/g-cqd/swift-ci): quality (swift-format,
# the analyzers against .ci/baselines), the tests on macOS (Litmus drives xcrun, Xcode and simulators: no Linux), the
# real-fixture smoke run nightly and on tags, and for a `v*` tag the archives and the release from
# release-notes/<tag>.md.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  merge_group:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request or branch cancels the run in progress: its macOS minutes would test a commit
# nobody waits for any more. Runs for main and for tags are never cancelled (main's history and releases stay whole).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main') }}

jobs:
  ci:
    name: Checks
    uses: g-cqd/swift-ci/.github/workflows/swift-ci.yml@07936b09eef98d5fcef4eac36a7c3f97de133e19 # swift-ci 07936b0
    permissions:
      contents: write # only used to publish a tag
    with:
      # The tests take ~11 min on a macOS runner; a hang now costs 25 min instead of 60.
      timeout-minutes: 25
    secrets:
      DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}

  attest:
    name: Attest · Build Provenance
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    uses: g-cqd/swift-ci/.github/workflows/attest-release.yml@07936b09eef98d5fcef4eac36a7c3f97de133e19 # swift-ci 07936b0
    permissions:
      contents: read
      id-token: write
      attestations: write

  scan:
    name: Code Scanning
    uses: g-cqd/swift-ci/.github/workflows/code-scanning.yml@07936b09eef98d5fcef4eac36a7c3f97de133e19 # swift-ci 07936b0
    permissions:
      contents: read
      security-events: write
      actions: read
