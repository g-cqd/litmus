name: CI

# swift-ci plans and runs the checks from .ci/action.json (https://github.com/g-cqd/swift-ci): quality (swift-format,
# the analyzers against .ci/baselines), the tests on macOS (Litmus drives xcrun, Xcode and simulators: no Linux), the
# real-fixture smoke run nightly and on tags, and for a `v*` tag the archives and the release from
# release-notes/<tag>.md.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  merge_group:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Checks
    uses: g-cqd/swift-ci/.github/workflows/swift-ci.yml@077676883cebb19f6febec70d980be464a3c9d18 # swift-ci 0776768
    permissions:
      contents: write # only used to publish a tag
    secrets:
      DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}

  attest:
    name: Attest · Build Provenance
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    uses: g-cqd/swift-ci/.github/workflows/attest-release.yml@077676883cebb19f6febec70d980be464a3c9d18 # swift-ci 0776768
    permissions:
      contents: read
      id-token: write
      attestations: write

  scan:
    name: Code Scanning
    uses: g-cqd/swift-ci/.github/workflows/code-scanning.yml@fda8ff085332c1883685384f975dff7227b1f7e5 # swift-ci fda8ff0
    permissions:
      contents: read
      security-events: write
      actions: read
