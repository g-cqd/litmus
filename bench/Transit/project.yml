name: Transit
options:
  bundleIdPrefix: dev.litmus.bench
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    GENERATE_INFOPLIST_FILE: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
packages:
  FareKit:
    path: Modules/FareKit
  TripKit:
    path: Modules/TripKit
  WalletKit:
    path: Modules/WalletKit
targets:
  Transit:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: FareKit
      - package: TripKit
      - package: WalletKit
  TransitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies: [{target: Transit}]
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Transit.app/Transit"
        BUNDLE_LOADER: "$(TEST_HOST)"
  TransitExtraTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppExtraTests]
    dependencies: [{target: Transit}]
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Transit.app/Transit"
        BUNDLE_LOADER: "$(TEST_HOST)"
  TransitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppUITests]
    dependencies: [{target: Transit}]
schemes:
  Transit:
    build:
      targets:
        Transit: all
    test:
      targets:
        - TransitTests
        - package: FareKit/FareKitTests
        - package: TripKit/TripKitTests
        - package: WalletKit/WalletKitTests
